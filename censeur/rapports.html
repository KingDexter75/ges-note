<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapports | Espace Censeur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js?v=2"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../css/eduneum-core.css?v=6">
  <link rel="stylesheet" href="../css/rapports.css?v=2">
  <script src="../js/core/routes.js?v=4"></script>
  <script src="../js/core/store.js?v=9"></script>
  <script src="../js/core/calculs.js?v=3"></script>
  <script src="../js/core/auth.js?v=2"></script>
  <script src="../js/core/ui.js?v=3"></script>
  <script src="../js/core/page.js?v=2"></script>
  <script src="../js/core/acces.js?v=4"></script>
  <script src="../js/core/layout.js?v=6"></script>
  <script src="../js/core/i18n.js?v=5"></script>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row" data-sd-id="1">
    <aside class="w-full md:w-64 flex flex-col p-6 space-y-8 z-50 vt-sidebar">
      <div class="flex items-center space-x-3 nm-soft-convex p-4 rounded-2xl">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center text-white shadow-lg">
          <iconify-icon icon="lucide:graduation-cap" width="24"></iconify-icon>
        </div>
        <span class="font-bold text-xl tracking-tight display-font">EduNeum.</span>
      </div>
    </aside>
    <main id="main-content" class="flex-1 flex flex-col p-6 md:p-10 space-y-8 overflow-y-auto relative">
      <header class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-col">
          <h1 class="text-3xl font-extrabold display-font tracking-tight">Rapports Censeur</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Statistiques d'assiduité et discipline</p>
        </div>
        <div class="flex items-center space-x-4 no-print">
          <div class="nm-inset p-1 rounded-full flex" role="group" aria-label="Langue">
            <button type="button" id="lang-fr" class="px-4 py-1 text-xs font-bold bg-accent text-white rounded-full shadow-md">FR</button>
            <button type="button" id="lang-en" class="px-4 py-1 text-xs text-gray-500 font-medium">EN</button>
          </div>
          <button id="theme-toggle" class="w-10 h-10 nm-soft-convex rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-accent transition-colors">
            <iconify-icon icon="lucide:sun" class="dark:hidden"></iconify-icon>
            <iconify-icon icon="lucide:moon" class="hidden dark:block"></iconify-icon>
          </button>
        </div>
      </header>

      <section class="nm-flat p-6 rounded-[32px] grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="censeur-kpi">
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Classes responsables</p>
          <h3 id="stat-classes" class="text-3xl font-black">0</h3>
        </div>
        <div class="censeur-kpi">
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Élèves suivis</p>
          <h3 id="stat-eleves" class="text-3xl font-black text-blue-500">0</h3>
        </div>
        <div class="censeur-kpi">
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Absences non just.</p>
          <h3 id="stat-abs-nj" class="text-3xl font-black text-red-500">0</h3>
        </div>
        <div class="censeur-kpi">
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Sanctions en cours</p>
          <h3 id="stat-sanctions" class="text-3xl font-black text-orange-500">0</h3>
        </div>
      </section>

      <section class="nm-flat p-6 rounded-[32px] flex flex-col">
        <h2 class="text-xl font-bold display-font mb-6">Absences par classe</h2>
        <div id="absences-chart" class="flex-1 min-h-[300px] flex items-center justify-center">
          <div class="text-center text-gray-500">
            <iconify-icon icon="lucide:bar-chart-3" width="48" class="mb-2"></iconify-icon>
            <p>Graphique des absences par classe</p>
          </div>
        </div>
      </section>

      <section class="nm-flat p-6 rounded-[32px] flex flex-col">
        <h2 class="text-xl font-bold display-font mb-6">Sanctions par type</h2>
        <div id="sanctions-chart" class="flex-1 min-h-[300px] flex items-center justify-center">
          <div class="text-center text-gray-500">
            <iconify-icon icon="lucide:pie-chart" width="48" class="mb-2"></iconify-icon>
            <p>Répartition des sanctions</p>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/rapports-censeur.js?v=2"></script>
</body>
</html>
