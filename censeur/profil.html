<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil | Espace Censeur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../css/eduneum-core.css?v=4">
  <link rel="stylesheet" href="../css/profil.css?v=2">
  <script src="../js/core/routes.js?v=3"></script>
  <script src="../js/core/store.js?v=6"></script>
  <script src="../js/core/calculs.js?v=3"></script>
  <script src="../js/core/auth.js?v=2"></script>
  <script src="../js/core/ui.js?v=2"></script>
  <script src="../js/core/page.js?v=2"></script>
  <script src="../js/core/acces.js?v=4"></script>
  <script src="../js/core/layout.js?v=5"></script>
  <script src="../js/core/i18n.js?v=2"></script>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 flex flex-col p-6 space-y-8 z-50 vt-sidebar">
      <div class="flex items-center space-x-3 nm-soft-convex p-4 rounded-2xl">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center text-white shadow-lg">
          <iconify-icon icon="lucide:graduation-cap" width="24"></iconify-icon>
        </div>
        <span class="font-bold text-xl tracking-tight display-font">EduNeum.</span>
      </div>
    </aside>
    <main class="flex-1 p-6 lg:p-10 space-y-8 overflow-y-auto vt-main-content">
      <header class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-col">
          <h1 class="text-3xl font-extrabold display-font tracking-tight">Mon Profil</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Informations personnelles et préférences</p>
        </div>
        <div class="flex items-center space-x-4" id="actions"></div>
      </header>

      <section class="nm-flat p-8 rounded-[40px] max-w-2xl">
        <div class="flex items-center gap-6 mb-8">
          <div class="w-24 h-24 rounded-2xl bg-accent flex items-center justify-center text-white shadow-lg">
            <iconify-icon icon="lucide:user" width="48"></iconify-icon>
          </div>
          <div>
            <h2 class="text-2xl font-bold display-font" id="profil-nom">Censeur</h2>
            <p class="text-gray-500" id="profil-role">Vice-Principal</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="nm-inset rounded-xl p-4">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-1">Téléphone</p>
            <p class="font-bold" id="profil-telephone">—</p>
          </div>
          <div class="nm-inset rounded-xl p-4">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-1">Email</p>
            <p class="font-bold text-sm" id="profil-email">—</p>
          </div>
          <div class="nm-inset rounded-xl p-4">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-1">Année scolaire</p>
            <p class="font-bold" id="profil-annee">—</p>
          </div>
          <div class="nm-inset rounded-xl p-4">
            <p class="text-[10px] uppercase tracking-widest text-gray-400 mb-1">Classes responsables</p>
            <p class="font-bold" id="profil-classes">—</p>
          </div>
        </div>

        <div class="pt-6 border-t border-gray-200 dark:border-gray-700">
          <h3 class="text-lg font-bold mb-4">Classes sous responsabilité</h3>
          <div id="profil-liste-classes" class="space-y-3"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/profil-censeur.js?v=2"></script>
</body>
</html>
