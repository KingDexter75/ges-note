<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes | Espace Censeur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind.config.js?v=2"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../css/eduneum-core.css?v=7">
  <link rel="stylesheet" href="../css/notes.css?v=2">
  <script src="../js/core/routes.js?v=4"></script>
  <script src="../js/core/store.js?v=9"></script>
  <script src="../js/core/calculs.js?v=3"></script>
  <script src="../js/core/auth.js?v=2"></script>
  <script src="../js/core/ui.js?v=3"></script>
  <script src="../js/core/page.js?v=2"></script>

  <script src="../js/core/layout.js?v=7"></script>

<body>
  <div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 flex flex-col p-6 space-y-8 z-50 vt-sidebar">
      <div class="flex items-center space-x-3 nm-soft-convex p-4 rounded-2xl">
        <div class="w-10 h-10 bg-accent rounded-xl flex items-center justify-center text-white shadow-lg">
          <iconify-icon icon="lucide:graduation-cap" width="24"></iconify-icon>
        </div>
        <span class="font-bold text-xl tracking-tight display-font">EduNeum.</span>
      </div>
    </aside>
    <main class="flex-1 p-6 lg:p-10 space-y-8 overflow-y-auto vt-main-content">
      <header class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-col">
          <h1 class="text-3xl font-extrabold display-font tracking-tight">Suivi des Notes</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Consultation des moyennes et rangs par matière</p>
        </div>
        <div class="flex items-center space-x-4" id="actions"></div>
      </header>
